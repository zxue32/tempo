# Sends "see you tomorrow" reminder emails every hour.
# Repository → Settings → Secrets and variables → Actions → add:
#   SITE_URL     e.g. https://your-site.netlify.app   (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET environment variable on the site
name: Booking reminders
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call reminder endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then echo "SITE_URL / CRON_SECRET not set, skipping"; exit 0; fi
          curl --fail-with-body -sS -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/cron/reminders"
